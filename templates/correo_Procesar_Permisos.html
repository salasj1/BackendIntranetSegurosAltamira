<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            /* background: linear-gradient(to right, rgb(14,70,150), rgb(12,68,142)); */
            padding: 20px;
            max-width:60em;
        }
        .email-content {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding-bottom: 0px;
        }
        .email-conten-info{
            padding: 20px;
        }
        .email-header {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 20px;
        }
        .email-body {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }
        .email-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777777;
        }
        .email-image-footer {
            display: flex;
            width: calc(100%);
            flex-grow: 1;
            font-size: 14px;
            color: #777777;
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-content">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse; background-color: #003f9e; border-radius: 10px 10px 0px 0px;">
            <tr>
                <td style="padding: 16px 0 16px 0; " align="center" >
                <img src="cid:logoEmpresa" alt="logo-empresa" border="0" width="75">
                </td>
            </tr>
            </table>
            <div class="email-conten-info">
                
            <div class="email-header">Procesar solicitud de Permiso</div>
            <div class="email-body" style="text-align: center;">
                <p style="margin-bottom: 24px;">${cuerpo}</p>
                <img src="cid:procesando" alt="Loading-Files-20251107135235" border="0" width="350" style="display: block; margin: 0 auto 24px auto; object-fit: cover; height: 120px; object-position: center;max-width: 350px; width: 100%;">
                <div style="margin-top: 16px;"></div>
                    <a href="${baseURL}/ProcesarPermisos"
                        style="
                        display: inline-block;
                        background: #003f9e;
                        color: #fff !important;
                        text-decoration: none;
                        font-weight: bold;
                        font-size: 1rem;
                        padding: 12px 32px;
                        border-radius: 20px 5px 20px 5px;
                        border: none;
                        cursor: pointer;
                        font-family: Arial, sans-serif;
                        margin-top: 8px;
                        "
                        target="_blank"
                    >Ir a Procesar</a>
                </div>
            </div>
            </table>
            <div class="email-footer" style="text-align: center;">
                <p>Intranet de Seguros Altamira</p>
            </div>
            <img src="https://media.licdn.com/dms/image/v2/D4E3DAQF0mlb0e_m8-Q/image-scale_191_1128/image-scale_191_1128/0/1678969137498/seguros_altamira_cover?e=2147483647&v=beta&t=oOSJm4jhoR01nmRztPezxIuPIdnn2WWJ8kt4j3tUYuE" class="email-image-footer" alt="Seguros Altamira"  style="text-align: left;">
            </div>
        </div>
    </div>
</body>
</html>
